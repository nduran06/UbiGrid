spring.cloud.config.import-check.enabled=false

# Application configuration
spring.application.name=traffic-analysis-service
server.port=8080
server.servlet.context-path=/

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/smartcity
spring.data.mongodb.database=smartcity
spring.data.mongodb.auto-index-creation=true

# Redis Cache Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000
spring.redis.database=0
redis.cache.ttl.minutes=30

# AWS Configuration
aws.region=us-east-1
aws.sqs.trafficDataQueue=smart-city-traffic-data-queue
aws.sagemaker.trafficPredictionEndpoint=smart-city-ml-traffic-prediction-dev
aws.sagemaker.anomalyDetectionEndpoint=smart-city-ml-anomaly-detection-dev
aws.sns.incidentTopic=smart-city-incident-alerts

# API Endpoints
api.sagemaker.endpoint=https://runtime.sagemaker.us-east-1.amazonaws.com
api.weather.endpoint=https://api.weather.gov
api.event.endpoint=https://api.events.example.com

# ML Service Configuration
ml.fallback.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.mongo.enabled=true
management.metrics.export.prometheus.enabled=true

# Route Optimization Configuration
route.optimization.weightCongestion=2.0
route.optimization.weightDistance=1.0
route.optimization.weightTime=3.0
route.optimization.weightSystemOptimality=1.5
route.optimization.emergencyVehiclePriority=0.8
route.optimization.vehicleCoordinationThreshold=20
route.recomputation.intervalMinutes=5
route.recomputation.intervalMs=300000

# Coordination Configuration
coordination.congestion.highThreshold=0.7
coordination.congestion.criticalThreshold=0.9
coordination.reroute.percentagePerCycle=0.2
coordination.signal.optimizationIntervalMinutes=10
coordination.area.segmentCount=50
coordination.monitoring.intervalMs=180000
coordination.fullSystem.cronExpression=0 */30 * * * *

# Traffic Signal Configuration
signal.greenTime.minSeconds=15
signal.greenTime.maxSeconds=120
signal.cycle.baseSeconds=240
signal.scheduledCheck.intervalMs=60000

# Incident Configuration
incident.alert.severityThreshold=0.7
incident.detection.intervalMs=120000
incident.resolution.checkIntervalMinutes=5
incident.resolution.checkIntervalMs=300000

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartcity=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Async Task Executor Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=async-task-

# Web Client Configuration
spring.codec.max-in-memory-size=5MB




# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ubigrid}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

