# Local development profile: run with
#   docker compose -f ../config/docker-compose.yml up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Points every AWS SDK client at the local Floci emulator (http://localhost:4566)
# instead of real AWS, and disables Eureka self-registration since no discovery
# server runs as part of this local stack.

# AWS SDK -> Floci (local AWS emulator, drop-in LocalStack replacement)
aws.region=us-east-1
aws.accessKey=test
aws.secretKey=test
aws.endpoint.url=http://localhost:4566

# No local Eureka server is part of this stack
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
