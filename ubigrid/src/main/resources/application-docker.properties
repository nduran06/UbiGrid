# Docker Compose profile: the app runs as its own container on the
# "ubigrid-net" network, so it reaches every dependency by service name
# instead of localhost.

spring.data.mongodb.uri=${MONGO_URI:mongodb://mongodb:27017/smartcity}

spring.redis.host=${REDIS_HOST:redis}
spring.redis.port=${REDIS_PORT:6379}

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/ubigrid}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# AWS components (SageMaker Runtime today; SQS/SNS/S3/DynamoDB/CloudWatch if
# added later) resolve to Floci, the local AWS emulator, instead of real AWS.
aws.region=us-east-1
aws.accessKey=${AWS_ACCESS_KEY_ID:test}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:test}
aws.endpoint.url=${AWS_ENDPOINT_URL:http://floci:4566}

# No standalone Eureka server ships with this local stack.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
